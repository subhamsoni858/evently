version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: evently_mongodb
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:6.0
    container_name: evently_mongodb_init
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongodb --eval "
        try {
          rs.status();
          console.log('Replica set already initialized');
        } catch (e) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'localhost:27017' }]
          });
          console.log('Replica set successfully initialized');
        }
      "

  redis:
    image: redis:7-alpine
    container_name: evently_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: evently_backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/evently?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=productionjwtsecretvalueforlocalcompose
      - JWT_EXPIRE=15m
      - REFRESH_TOKEN_SECRET=productionrefreshsecretvalueforlocalcompose
      - REFRESH_TOKEN_EXPIRE=7d
      - CLIENT_URL=http://localhost:5173
      - CLOUDINARY_CLOUD_NAME=dummycloudinarycloud
      - CLOUDINARY_API_KEY=dummyapi
      - CLOUDINARY_API_SECRET=dummysecret
      - RAZORPAY_KEY_ID=rzp_test_SwU7B90Ct9pKR9
      - RAZORPAY_KEY_SECRET=rzp_test_secret_value
      - SMTP_HOST=smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=dummy
      - SMTP_PASS=dummy
      - FROM_EMAIL=tickets@evently.com
      - FROM_NAME=Evently Bookings
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5050/api
        - VITE_RAZORPAY_KEY_ID=rzp_test_SwU7B90Ct9pKR9
    container_name: evently_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
